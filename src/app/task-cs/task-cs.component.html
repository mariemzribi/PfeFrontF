<h2 mat-dialog-title>Add a supplement</h2>

<form [formGroup]="supplementForm" class="dialog-form">
  <mat-dialog-content class="form-grid">
    <div class="form-row">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Reg Package</mat-label>
        <input matInput type="number" formControlName="regPackageId"maxlength="3"min="0"max="999"oninput="this.value = this.value.slice(0, 3)">
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Number of modified TC</mat-label>
        <input matInput type="number" formControlName="nbTcModified"maxlength="3"min="0"max="999"oninput="this.value = this.value.slice(0, 3)" >
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Time for TC creation</mat-label>
        <input matInput type="number" formControlName="timeNeededForTcCreation" maxlength="3"min="0"max="999"oninput="this.value = this.value.slice(0, 3)" >
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Time to test</mat-label>
        <input matInput type="number" formControlName="timeNeededToTest" maxlength="3"min="0"max="999"oninput="this.value = this.value.slice(0, 3)">
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Bugs found</mat-label>
        <input matInput type="number" formControlName="bugsRaised" maxlength="3"min="0"max="999"oninput="this.value = this.value.slice(0, 3)">
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Number of CT
        </mat-label>
        <input matInput type="number" formControlName="nbTc" maxlength="3"min="0"max="999"oninput="this.value = this.value.slice(0, 3)">
      </mat-form-field>
    </div>

    <div class="form-row">
      
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Comment</mat-label>
        <input matInput type="text" formControlName="comment" >
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button mat-button (click)="onCancel()" class="cancel-button">Cancel</button>
    <button mat-button color="primary" (click)="onSave()" class="save-button">To safeguard</button>
  </mat-dialog-actions>
</form>
